<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>هدم وتكسير في الدمام والمنطقة الشرقية | التميز لمقاولات الهدم</title>
<meta name="description" content="التميز لمقاولات الهدم، خدمات هدم المنازل والمباني القديمة وتكسير الجدران والخرسانة في الدمام والمنطقة الشرقية. تواصل معنا للبدء في معاينة مشروعك.">
<meta name="theme-color" content="#111111">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --black:#0c0c0c;
  --black-2:#151515;
  --white:#f5f3ef;
  --muted:#a9a6a0;
  --orange:#ff5a16;
  --orange-2:#ff6d2d;
  --line:rgba(255,255,255,.12);
  --dark-line:rgba(0,0,0,.12);
  --max:1440px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--black);
  color:var(--white);
  font-family:"IBM Plex Sans Arabic",sans-serif;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

img{
  display:block;
  width:100%;
}

::selection{
  background:var(--orange);
  color:#fff;
}

/* =========================================================
   HEADER
========================================================= */

.dm-header{
  position:absolute;
  inset:0 0 auto;
  z-index:100;
  height:92px;
  border-bottom:1px solid rgba(255,255,255,.12);
}

.dm-header-inner{
  width:min(var(--max),calc(100% - 80px));
  height:100%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.dm-logo{
  display:flex;
  align-items:center;
  gap:13px;
}

.dm-logo-mark{
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  background:var(--orange);
  color:#fff;
  font-family:"Tajawal",sans-serif;
  font-weight:900;
  font-size:21px;
}

.dm-logo-text{
  display:flex;
  flex-direction:column;
  line-height:1.05;
}

.dm-logo-text strong{
  font-family:"Tajawal",sans-serif;
  font-size:18px;
  font-weight:900;
}

.dm-logo-text span{
  margin-top:5px;
  color:#aaa;
  font-size:11px;
}

.dm-nav{
  display:flex;
  align-items:center;
  gap:34px;
}

.dm-nav a{
  color:#ddd;
  font-size:14px;
  font-weight:500;
  transition:.2s;
}

.dm-nav a:hover{
  color:#fff;
}

.dm-header-action{
  display:flex;
  align-items:center;
  gap:10px;
}

.dm-header-phone{
  height:46px;
  padding:0 20px;
  border:1px solid rgba(255,255,255,.2);
  display:flex;
  align-items:center;
  gap:9px;
  font-size:14px;
  font-weight:700;
}

.dm-header-phone:hover{
  background:#fff;
  color:#111;
}

.dm-header-wa{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  background:#20c76b;
  color:#fff;
  font-size:20px;
}

/* =========================================================
   HERO
========================================================= */

.dm-hero{
  min-height:100svh;
  position:relative;
  display:flex;
  align-items:flex-end;
  overflow:hidden;
  background:#111;
}

.dm-hero-image{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(
      90deg,
      rgba(5,5,5,.12) 0%,
      rgba(5,5,5,.48) 42%,
      rgba(5,5,5,.92) 100%
    ),
    url("https://images.pexels.com/photos/2219024/pexels-photo-2219024.jpeg?auto=compress&cs=tinysrgb&w=2200");
  background-size:cover;
  background-position:center;
  transform:scale(1.01);
}

.dm-hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(0deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.08) 45%,rgba(0,0,0,.25) 100%);
  pointer-events:none;
}

.dm-hero-content{
  position:relative;
  z-index:2;
  width:min(var(--max),calc(100% - 80px));
  margin:0 auto;
  padding:0 0 100px;
}

.dm-hero-kicker{
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:25px;
  color:#ddd;
  font-size:15px;
  font-weight:600;
}

.dm-hero-kicker::before{
  content:"";
  width:42px;
  height:3px;
  background:var(--orange);
}

.dm-hero h1{
  max-width:1000px;
  font-family:"Tajawal",sans-serif;
  font-size:clamp(56px,7.7vw,116px);
  line-height:.93;
  letter-spacing:-4px;
  font-weight:900;
}

.dm-hero h1 span{
  color:var(--orange);
}

.dm-hero-bottom{
  margin-top:38px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:50px;
}

.dm-hero-copy{
  max-width:560px;
  color:#d1cfca;
  font-size:18px;
  line-height:1.9;
}

.dm-actions{
  display:flex;
  gap:12px;
  flex-shrink:0;
}

.dm-btn{
  min-width:190px;
  height:62px;
  padding:0 27px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:11px;
  font-size:16px;
  font-weight:800;
  transition:.25s;
}

.dm-btn-orange{
  background:var(--orange);
  color:#fff;
}

.dm-btn-orange:hover{
  background:#fff;
  color:#111;
  transform:translateY(-3px);
}

.dm-btn-outline{
  border:1px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.18);
  backdrop-filter:blur(7px);
}

.dm-btn-outline:hover{
  background:#fff;
  color:#111;
  transform:translateY(-3px);
}

.dm-hero-location{
  position:absolute;
  z-index:3;
  left:40px;
  bottom:42px;
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  color:#999;
  font-size:11px;
  letter-spacing:2px;
}

/* =========================================================
   INTRO STRIP
========================================================= */

.dm-intro{
  background:var(--orange);
  color:#111;
  padding:25px 0;
}

.dm-intro-inner{
  width:min(var(--max),calc(100% - 80px));
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
}

.dm-intro strong{
  font-family:"Tajawal",sans-serif;
  font-size:clamp(21px,2vw,30px);
  font-weight:900;
}

.dm-intro span{
  font-size:14px;
  font-weight:700;
}

/* =========================================================
   SECTION BASE
========================================================= */

.dm-section{
  padding:125px 0;
}

.dm-container{
  width:min(var(--max),calc(100% - 80px));
  margin:auto;
}

.dm-eyebrow{
  color:var(--orange);
  font-size:13px;
  font-weight:800;
  letter-spacing:.5px;
  margin-bottom:18px;
}

.dm-title{
  font-family:"Tajawal",sans-serif;
  font-size:clamp(42px,5vw,76px);
  line-height:1;
  letter-spacing:-2px;
  font-weight:900;
}

.dm-lead{
  max-width:650px;
  color:#a9a6a0;
  font-size:18px;
  line-height:1.9;
}

/* =========================================================
   SERVICES
========================================================= */

.dm-services{
  background:#f1eee8;
  color:#111;
}

.dm-services-head{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:80px;
  margin-bottom:75px;
}

.dm-services .dm-title{
  color:#111;
}

.dm-services .dm-lead{
  color:#68645e;
  align-self:end;
}

.dm-service{
  display:grid;
  grid-template-columns:90px 1fr 1.1fr;
  min-height:310px;
  border-top:1px solid #c9c5bd;
  align-items:center;
  gap:45px;
  transition:.3s;
}

.dm-service:last-child{
  border-bottom:1px solid #c9c5bd;
}

.dm-service-number{
  font-family:"Tajawal",sans-serif;
  font-size:22px;
  color:#9b9790;
  font-weight:800;
}

.dm-service-info h3{
  font-family:"Tajawal",sans-serif;
  font-size:clamp(30px,3vw,46px);
  line-height:1;
  font-weight:900;
  margin-bottom:18px;
}

.dm-service-info p{
  max-width:430px;
  color:#66615b;
  line-height:1.8;
  font-size:16px;
}

.dm-service-image{
  height:230px;
  overflow:hidden;
}

.dm-service-image img{
  height:100%;
  object-fit:cover;
  filter:saturate(.75);
  transition:.6s;
}

.dm-service:hover .dm-service-image img{
  transform:scale(1.05);
  filter:saturate(1);
}

/* =========================================================
   DARK FEATURE
========================================================= */

.dm-feature{
  background:#111;
  padding:140px 0;
}

.dm-feature-grid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:90px;
  align-items:center;
}

.dm-feature-image{
  height:650px;
  position:relative;
  overflow:hidden;
}

.dm-feature-image img{
  height:100%;
  object-fit:cover;
}

.dm-feature-image::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.75));
}

.dm-feature-tag{
  position:absolute;
  z-index:2;
  bottom:28px;
  right:28px;
  font-size:13px;
  color:#ddd;
}

.dm-feature-copy .dm-title{
  margin-bottom:30px;
}

.dm-feature-copy > p{
  max-width:570px;
  color:#a9a6a0;
  font-size:18px;
  line-height:2;
}

.dm-feature-list{
  margin-top:45px;
  border-top:1px solid var(--line);
}

.dm-feature-item{
  padding:24px 0;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:20px;
}

.dm-feature-item b{
  width:35px;
  height:35px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  background:var(--orange);
  color:#fff;
  font-size:14px;
}

.dm-feature-item span{
  color:#ddd;
  font-size:16px;
  font-weight:600;
}

/* =========================================================
   PROCESS
========================================================= */

.dm-process{
  background:#171717;
}

.dm-process-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:50px;
  margin-bottom:70px;
}

.dm-process-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--line);
}

.dm-step{
  padding:42px 35px 20px;
  border-left:1px solid var(--line);
  min-height:270px;
}

.dm-step:last-child{
  border-left:0;
}

.dm-step-num{
  color:var(--orange);
  font-family:"Tajawal",sans-serif;
  font-size:18px;
  font-weight:900;
  margin-bottom:60px;
}

.dm-step h3{
  font-family:"Tajawal",sans-serif;
  font-size:30px;
  font-weight:900;
  margin-bottom:14px;
}

.dm-step p{
  color:#98958f;
  font-size:15px;
  line-height:1.8;
}

/* =========================================================
   COVERAGE / MAP
========================================================= */

.dm-coverage{
  background:#ece9e2;
  color:#111;
}

.dm-coverage-grid{
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:70px;
  align-items:stretch;
}

.dm-coverage-copy{
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.dm-coverage-copy .dm-title{
  margin-bottom:25px;
}

.dm-coverage-copy p{
  color:#66615b;
  font-size:17px;
  line-height:1.9;
  max-width:520px;
}

.dm-city-list{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:30px;
}

.dm-city{
  border:1px solid #bbb6ad;
  padding:10px 16px;
  font-size:14px;
  font-weight:700;
}

.dm-map{
  min-height:530px;
  background:#d5d1ca;
  position:relative;
  overflow:hidden;
}

.dm-map iframe{
  width:100%;
  height:100%;
  min-height:530px;
  border:0;
  filter:grayscale(.85) contrast(1.05);
}

.dm-map-label{
  position:absolute;
  z-index:2;
  top:22px;
  right:22px;
  background:#111;
  color:#fff;
  padding:13px 18px;
  font-size:12px;
  font-weight:700;
}

/* =========================================================
   GALLERY
========================================================= */

.dm-gallery{
  background:#111;
}

.dm-gallery-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:40px;
  margin-bottom:55px;
}

.dm-gallery-grid{
  display:grid;
  grid-template-columns:1.35fr .8fr .8fr;
  grid-template-rows:290px 290px;
  gap:12px;
}

.dm-gallery-item{
  overflow:hidden;
  position:relative;
}

.dm-gallery-item:first-child{
  grid-row:1 / 3;
}

.dm-gallery-item img{
  height:100%;
  object-fit:cover;
  transition:.7s;
}

.dm-gallery-item:hover img{
  transform:scale(1.04);
}

.dm-gallery-note{
  margin-top:20px;
  color:#77736d;
  font-size:12px;
}

/* =========================================================
   FAQ
========================================================= */

.dm-faq{
  background:#f1eee8;
  color:#111;
}

.dm-faq-grid{
  display:grid;
  grid-template-columns:.75fr 1.25fr;
  gap:100px;
}

.dm-faq .dm-title{
  color:#111;
}

.dm-faq-list{
  border-top:1px solid #c9c5bd;
}

.dm-faq-item{
  border-bottom:1px solid #c9c5bd;
}

.dm-faq-question{
  width:100%;
  background:none;
  border:0;
  padding:27px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  cursor:pointer;
  color:#111;
  text-align:right;
  font-family:"IBM Plex Sans Arabic",sans-serif;
  font-size:18px;
  font-weight:700;
}

.dm-faq-plus{
  width:35px;
  height:35px;
  border:1px solid #aaa59d;
  display:grid;
  place-items:center;
  flex-shrink:0;
  font-size:22px;
  font-weight:400;
}

.dm-faq-answer{
  display:grid;
  grid-template-rows:0fr;
  transition:.3s;
}

.dm-faq-answer-inner{
  overflow:hidden;
}

.dm-faq-answer p{
  padding:0 0 25px;
  color:#66615b;
  line-height:1.9;
  font-size:15px;
}

.dm-faq-item.active .dm-faq-answer{
  grid-template-rows:1fr;
}

.dm-faq-item.active .dm-faq-plus{
  background:#111;
  color:#fff;
  border-color:#111;
}

/* =========================================================
   FINAL CTA
========================================================= */

.dm-final{
  min-height:650px;
  position:relative;
  display:flex;
  align-items:center;
  overflow:hidden;
}

.dm-final-bg{
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,rgba(0,0,0,.9),rgba(0,0,0,.55)),
    url("https://images.pexels.com/photos/2101137/pexels-photo-2101137.jpeg?auto=compress&cs=tinysrgb&w=2200");
  background-size:cover;
  background-position:center;
}

.dm-final-content{
  position:relative;
  z-index:2;
  width:min(var(--max),calc(100% - 80px));
  margin:auto;
}

.dm-final .dm-eyebrow{
  margin-bottom:25px;
}

.dm-final h2{
  max-width:950px;
  font-family:"Tajawal",sans-serif;
  font-size:clamp(48px,7vw,100px);
  line-height:.96;
  letter-spacing:-3px;
  font-weight:900;
}

.dm-final h2 span{
  color:var(--orange);
}

.dm-final-actions{
  display:flex;
  gap:12px;
  margin-top:40px;
}

/* =========================================================
   FOOTER
========================================================= */

.dm-footer{
  background:#080808;
  padding:55px 0 30px;
}

.dm-footer-inner{
  width:min(var(--max),calc(100% - 80px));
  margin:auto;
  display:flex;
  justify-content:space-between;
  gap:50px;
  padding-bottom:35px;
  border-bottom:1px solid var(--line);
}

.dm-footer-brand p{
  max-width:400px;
  margin-top:18px;
  color:#777;
  line-height:1.8;
  font-size:14px;
}

.dm-footer-contact{
  text-align:left;
}

.dm-footer-contact small{
  display:block;
  color:#777;
  margin-bottom:8px;
}

.dm-footer-contact a{
  color:#fff;
  font-family:"Tajawal",sans-serif;
  font-size:24px;
  font-weight:800;
}

.dm-footer-bottom{
  width:min(var(--max),calc(100% - 80px));
  margin:22px auto 0;
  display:flex;
  justify-content:space-between;
  color:#555;
  font-size:11px;
}

/* =========================================================
   POPUP
========================================================= */

.dm-modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(12px);
  opacity:0;
  visibility:hidden;
  transition:.35s;
}

.dm-modal.active{
  opacity:1;
  visibility:visible;
}

.dm-modal-box{
  width:min(650px,100%);
  background:#151515;
  border:1px solid rgba(255,255,255,.14);
  padding:55px;
  position:relative;
  transform:translateY(25px);
  transition:.35s;
}

.dm-modal.active .dm-modal-box{
  transform:translateY(0);
}

.dm-modal-close{
  position:absolute;
  top:18px;
  left:18px;
  width:40px;
  height:40px;
  border:1px solid rgba(255,255,255,.2);
  background:none;
  color:#fff;
  cursor:pointer;
  font-size:22px;
}

.dm-modal-label{
  color:var(--orange);
  font-size:13px;
  font-weight:800;
  margin-bottom:18px;
}

.dm-modal h2{
  font-family:"Tajawal",sans-serif;
  font-size:clamp(38px,5vw,58px);
  line-height:1;
  font-weight:900;
  margin-bottom:18px;
}

.dm-modal p{
  color:#999;
  font-size:16px;
  line-height:1.8;
  margin-bottom:30px;
}

.dm-modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.dm-modal-btn{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:16px;
  font-weight:800;
}

.dm-modal-call{
  background:var(--orange);
}

.dm-modal-wa{
  background:#20c76b;
}

.dm-modal-skip{
  display:block;
  margin:22px auto 0;
  background:none;
  border:0;
  color:#777;
  cursor:pointer;
  font-family:inherit;
  font-size:12px;
}

/* =========================================================
   FLOATING / MOBILE
========================================================= */

.dm-floating-wa{
  position:fixed;
  left:24px;
  bottom:24px;
  z-index:90;
  width:58px;
  height:58px;
  display:grid;
  place-items:center;
  background:#20c76b;
  color:#fff;
  font-size:25px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.dm-mobile-bar{
  display:none;
}

/* =========================================================
   REVEAL
========================================================= */

.dm-reveal{
  opacity:0;
  transform:translateY(25px);
  transition:.7s ease;
}

.dm-reveal.visible{
  opacity:1;
  transform:none;
}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .dm-reveal{
    opacity:1;
    transform:none;
    transition:none;
  }
}

/* =========================================================
   TABLET
========================================================= */

@media(max-width:1000px){

  .dm-header-inner,
  .dm-container,
  .dm-hero-content,
  .dm-intro-inner,
  .dm-final-content,
  .dm-footer-inner,
  .dm-footer-bottom{
    width:min(100% - 45px,var(--max));
  }

  .dm-nav{
    display:none;
  }

  .dm-hero-content{
    padding-bottom:80px;
  }

  .dm-hero h1{
    font-size:clamp(52px,9vw,85px);
  }

  .dm-services-head,
  .dm-feature-grid,
  .dm-coverage-grid,
  .dm-faq-grid{
    grid-template-columns:1fr;
    gap:45px;
  }

  .dm-feature-image{
    height:500px;
  }
